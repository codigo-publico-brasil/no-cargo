[project]
name = "nocargo"
version = "0.0.0"
description = "No Cargo: quem ocupa o poder no Brasil, pelos três poderes, com a fonte oficial ao lado. Gera um site estático a partir do esquema marts da plataforma de dados."
requires-python = ">=3.13"
dependencies = ["duckdb>=1.1"]

[project.scripts]
nocargo = "nocargo.__main__:main"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nocargo"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"src/nocargo/paginas.py" = ["E501"]  # HTML e SQL em texto
"src/nocargo/textos.py" = ["E501"]
"src/nocargo/formato.py" = ["E501"]
"src/nocargo/dados.py" = ["E501"]

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "src"
packages = ["nocargo"]
